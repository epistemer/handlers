openapi: 3.0.3
info: {title: Toy shop, version: 1.0.0}
servers:
  - url: https://shop.example/api/v1
security:
  - bearerAuth: []
paths:
  /auth/sign-in:
    post:
      operationId: signIn
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: object, properties: {token: {type: string}}}}}}
        default: {$ref: "#/components/responses/Error"}
  /orders:
    get:
      operationId: listOrders
      x-permission: orders.read
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/Status"}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Order"}}}}}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  items: {type: object, required: [sku, qty], properties: {sku: {type: string}, qty: {type: integer, minimum: 1}}}
      responses:
        "201": {description: created, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        default: {$ref: "#/components/responses/Error"}
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      responses:
        "200": {description: ok, content: {application/json: {schema: {$ref: "#/components/schemas/Order"}}}}
        default: {$ref: "#/components/responses/Error"}
  /orders/{orderId}/receipt:
    post:
      operationId: uploadReceipt
      x-auth: session
      x-max-body: 20MiB
      parameters:
        - {name: orderId, in: path, required: true, schema: {type: integer, format: int64}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
                note: {type: string}
      responses:
        "204": {description: stored}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Error:
      description: error
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties: {code: {type: string}, message: {type: string}}
    Status: {type: string, enum: [open, paid, shipped]}
    Money:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      x-go-type: decimal.Decimal
      x-go-type-import: {path: github.com/shopspring/decimal}
    Order:
      type: object
      required: [id, status, total]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: "#/components/schemas/Status"}
        total: {$ref: "#/components/schemas/Money"}
