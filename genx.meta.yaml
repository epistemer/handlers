version: 1

generators:
  routes:
    doc: route table, Handler interface, Register, and URL builders for HTML routes
    needs: [routes/v1]
    units: |
      def parse_bits:
        if . == "int8" or . == "uint8" then 8
        elif . == "int16" or . == "uint16" then 16
        elif . == "int32" or . == "uint32" then 32
        elif . == "int64" or . == "uint64" then 64
        else 0
        end;

      def surface_const:
        if . == "html" then "handlers.HTML"
        elif . == "json" then "handlers.JSON"
        else error("routes: unknown surface \(.)")
        end;

      def auth_const:
        if . == "public" then "handlers.Public"
        elif . == "session" then "handlers.Session"
        elif . == "permission" then "handlers.Permission"
        else error("routes: unknown auth \(.)")
        end;

      def url_parts($params):
        if . == "/" then
          [{is_lit: true, lit: "/"}]
        else
          reduce (ltrimstr("/") | split("/"))[] as $seg (
            {lit: "", parts: []};
            if ($seg | (startswith("{") and endswith("}"))) then
              ($seg | ltrimstr("{") | rtrimstr("}") | rtrimstr("...")) as $wname
              | ($params | map(select(.name == $wname)) | .[0]) as $p
              | if $p == null then error("routes: wildcard \($seg) has no param") else . end
              | {
                  lit: "",
                  parts: (.parts + [
                    {is_lit: true, lit: (.lit + "/")},
                    {is_lit: false, index: $p.index, parse: $p.parse, is_rest: $p.is_rest, is_int: $p.is_int, is_uint: $p.is_uint}
                  ])
                }
            else
              .lit += ("/" + $seg)
            end
          )
          | if .lit != "" then .parts + [{is_lit: true, lit: .lit}] else .parts end
        end;

      .["routes/v1"][]
      | . as $doc
      | [.routes | to_entries[] | .key as $ri | .value as $r |
          [ $r.params | to_entries[] | {
              index: .key,
              name: .value.name,
              type: .value.type,
              var: .value.var,
              parse: .value.parse,
              is_rest: (.value.kind == "rest"),
              is_int: (.value.parse | startswith("int")),
              is_uint: (.value.parse | startswith("uint")),
              bits: (.value.parse | parse_bits)
            } ] as $params
          | {
              index: $ri,
              key: $r.key,
              method: $r.method,
              pattern: $r.pattern,
              name: $r.name,
              var: $r.var,
              auth_const: ($r.auth | auth_const),
              permission: ($r.permission // ""),
              view: $r.view,
              search: $r.search,
              entity: ($r.entity // ""),
              max_body: ($r.maxBody // 0),
              operation: ($r.operation // ""),
              params: $params,
              url_parts: ($r.pattern | url_parts($params))
            }
        ] as $routes
      | {
          package: $doc.package,
          prefix: $doc.prefix,
          is_json: ($doc.surface == "json"),
          surface_const: ($doc.surface | surface_const),
          has_strconv: ([ $doc.routes[].params[] | select(.parse == "bool" or (.parse | startswith("int")) or (.parse | startswith("uint"))) ] | length) > 0,
          imports: ([ $doc.routes[].params[] | select(.import != "") | {alias: .alias, path: .import} ] | unique_by(.path) | sort_by(.path)),
          routes: $routes
        }
    out: '"\(.package.dir)/zz_\(.package.name)_routes.go"'
    template: routes.go.tmpl

  labels:
    doc: labels/v1 file for every route and parameter in a routes/v1 file
    needs: [routes/v1]
    emits: labels/v1
    units: |
      .["routes/v1"][]
      | {
          domain: "labels/v1",
          producer: "handlers",
          package: .package,
          labels: [
            .routes[] as $r
            | {key: ("route." + $r.key), text: $r.text, var: $r.var, path: ("route." + $r.key)},
              ($r.params[] | {key: ("route_param." + $r.key + "." + .name), text: .label, var: .var, path: ("route_param." + $r.key + "." + .name)})
          ]
        }
    out: '"\(.package.dir)/zz_\(.package.name).labels.json"'

  permissions:
    doc: auth/access permissions declared by routes/v1 files
    needs: [routes/v1]
    units: |
      def is_unverified:
        if . == "verified" then false
        elif . == "unverified" then true
        else error("permissions: unknown level \(.)")
        end;

      def check_refs($docs):
        reduce (
          $docs[] as $doc
          | ($doc.permissions[]? | select(.from != null and .from != "")) as $p
          | {doc: $doc, p: $p}
        ) as $item (
          null;
          $item.doc as $doc
          | $item.p as $p
          | $doc.package.dir as $dir
          | $p.key as $k
          | $p.from as $P
          | [ $docs[] | select(.package.name == $P) ] as $targets
          | if ($targets | length) > 1 then
              error("permission \"\($k)\" in \($dir): two routes packages are named \($P), in \($targets[0].package.dir) and \($targets[1].package.dir)")
            elif ($targets | length) == 0 then
              error("permission \"\($k)\" in \($dir): no routes package \($P)")
            else
              ($targets[0]) as $target
              | [ $target.permissions[]? | select((.from == null or .from == "") and .key == $k) ] as $decls
              | if ($decls | length) == 0 then
                  error("permission \"\($k)\" in \($dir): \($P) doesn't declare it")
                else
                  ($decls[0]) as $decl
                  | ($decl.level == "unverified") as $declUnv
                  | ($p.level == "unverified") as $takenUnv
                  | if $takenUnv and ($declUnv | not) then
                      ([ $doc.routes[]? | select(.permission == $k) | .key ] | first // $k) as $rk
                      | error("permission \"\($k)\" in \($dir): \($rk) is unverified and the declaration in \($P) isn't")
                    elif ($takenUnv | not) and $declUnv then
                      ([ $doc.routes[]? | select(.permission == $k) | .key ] | first // $k) as $rk
                      | error("permission \"\($k)\" in \($dir): \($rk) isn't unverified and the declaration in \($P) is")
                    else
                      .
                    end
                end
            end
        );

      .["routes/v1"] as $docs
      | ([ $docs | to_entries[] | .key as $idx | .value.package.dir as $dir | [ .value.permissions[]? | select(.from == null or .from == "") | .key ] | unique[] | {key: ., dir: $dir, idx: $idx} ]
         | group_by(.key)
         | map(select(length > 1) | sort_by(.idx))
         | first // null) as $dup
      | if $dup != null then
          error("permission \"\($dup[0].key)\" is in \($dup[0].dir) and \($dup[1].dir); declare it in one and take it from there with \"from <package>\"")
        else . end
      | check_refs($docs)
      | $docs[]
      | . as $doc
      | [ $doc.permissions[]? | select(.from == null or .from == "") ] as $declared
      | select(($declared | length) > 0)
      | {
          package: $doc.package,
          has_unverified: ([ $declared[] | select((.level | is_unverified)) ] | length) > 0,
          permissions: [ $declared[] | {key: .key, var: .var, text: .text, unverified: (.level | is_unverified)} ]
        }
    out: '"\(.package.dir)/zz_\(.package.name)_permissions.go"'
    template: permissions.go.tmpl
