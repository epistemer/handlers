version: 1

producers:
  - name: settings
    dir: internal/settings
    run: [go, tool, cfgx, gen, -artifacts, "-", ./schema]
    check: [go, tool, cfgx, gen, -check, -artifacts, "-", ./schema]
    emits:
      - internal/settings/zz_settings.labels.json

  - name: sqlc
    # No check command: genx check (and CI) trusts the committed
    # codegen_request.json without building or running sqlc.
    run: [go, tool, sqlc, generate, -f, sqlc.yaml]
    emits:
      - path: internal/models/codegen_request.json
        domain: sqlc.request/v1

  - name: admin-routes
    run: [go, tool, handlers, gen, -prefix, /admin, -out, internal/adminroutes, ./internal/admin]
    check: [go, tool, handlers, gen, -check, -prefix, /admin, -out, internal/adminroutes, ./internal/admin]
    emits:
      - internal/adminroutes/zz_adminroutes.routes.json

  - name: api-routes
    run: [go, tool, handlers, openapi, -key-prefix, api, -out, apiroutes, api/openapi.yaml]
    check: [go, tool, handlers, openapi, -check, -key-prefix, api, -out, apiroutes, api/openapi.yaml]
    emits:
      - apiroutes/zz_apiroutes.routes.json

use:
  - github.com/epistemer/handlers: [routes, labels, permissions]
  - github.com/epistemer/models:
      generators: [labels, enums]
      params:
        dir: internal/models
        table_prefix: shop_
  - github.com/epistemer/i18n: [labels]
