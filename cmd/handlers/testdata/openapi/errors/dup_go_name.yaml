openapi: 3.0.3
info: {title: Test, version: 1.0.0}
security: [{bearerAuth: []}]
paths:
  /orders:
    get:
      operationId: getOrder
      responses: {"200": {description: ok}}
    post:
      operationId: GetOrder
      responses: {"201": {description: created}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
